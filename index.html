<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICBS 2026 Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #eee;
      font-weight: bold;
      min-height: 20px;
    }

    .success {
      background: #d9f7df !important;
      color: #146c2e;
    }

    .error {
      background: #ffdede !important;
      color: #9b0000;
    }

    .info {
      background: #e4efff !important;
      color: #174a91;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>ICBS 2026 Attendance Scanner</h1>

  <input
    type="password"
    id="pin"
    placeholder="Staff PIN"
  >

  <select id="day">
    <option value="Day 1">Day 1</option>
    <option value="Day 2">Day 2</option>
    <option value="Day 3">Day 3</option>
  </select>

  <select id="entrance">
    <option value="Entrance 1">Entrance 1</option>
    <option value="Entrance 2">Entrance 2</option>
  </select>

  <select id="cameraSelect">
    <option value="">Select camera</option>
  </select>

  <button id="startBtn" onclick="startScanner()">
    Start Scanner
  </button>

  <button id="stopBtn" onclick="stopScanner()" disabled>
    Stop Scanner
  </button>

  <div id="reader"></div>

  <div id="status">
    Scanner ready.
  </div>

</div>

<script>

const STAFF_PIN = "808901";

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzRASzTUExQTdYrQmiE7tI0XndhxdGD7V3ioYBz25Eo9Mu9MWB-2A61qvzgoVST8lUF8A/exec";

let scanner = null;
let processingScan = false;
let currentCameraId = null;


/* --------------------------------
   STATUS
-------------------------------- */

function setStatus(message, type = "") {

  const box = document.getElementById("status");

  box.textContent = message;

  box.className = "";

  if (type) {
    box.classList.add(type);
  }
}


/* --------------------------------
   LOAD CAMERAS
-------------------------------- */

async function loadCameras() {

  try {

    const devices =
      await Html5Qrcode.getCameras();

    const select =
      document.getElementById("cameraSelect");

    select.innerHTML =
      '<option value="">Select camera</option>';

    if (!devices || devices.length === 0) {

      setStatus(
        "No camera found.",
        "error"
      );

      return;
    }

    let preferredCamera = devices[0];

    for (const camera of devices) {

      const label =
        (camera.label || "").toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        preferredCamera = camera;
        break;
      }
    }

    devices.forEach(camera => {

      const option =
        document.createElement("option");

      option.value = camera.id;

      option.textContent =
        camera.label ||
        "Camera " + camera.id;

      select.appendChild(option);

    });

    select.value = preferredCamera.id;

    currentCameraId =
      preferredCamera.id;

    setStatus(
      "Camera ready. Select your day and entrance, then start scanning.",
      "info"
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "Unable to access camera.",
      "error"
    );

  }
}


/* --------------------------------
   START SCANNER
-------------------------------- */

async function startScanner() {

  const pin =
    document.getElementById("pin").value.trim();

  if (pin !== STAFF_PIN) {

    setStatus(
      "Incorrect staff PIN.",
      "error"
    );

    return;
  }

  const cameraSelect =
    document.getElementById("cameraSelect");

  currentCameraId =
    cameraSelect.value;

  if (!currentCameraId) {

    setStatus(
      "Please select a camera.",
      "error"
    );

    return;
  }

  if (scanner) {

    await stopScanner();

  }

  scanner =
    new Html5Qrcode("reader");

  try {

    await scanner.start(

      currentCameraId,

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      () => {}

    );

    document.getElementById("startBtn").disabled =
      true;

    document.getElementById("stopBtn").disabled =
      false;

    setStatus(
      "Scanner ready to scan participant code.",
      "info"
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "Unable to start camera.",
      "error"
    );

  }
}


/* --------------------------------
   STOP SCANNER
-------------------------------- */

async function stopScanner() {

  try {

    if (scanner) {

      await scanner.stop();

      await scanner.clear();

      scanner = null;

    }

  } catch (error) {

    console.error(error);

  }

  document.getElementById("startBtn").disabled =
    false;

  document.getElementById("stopBtn").disabled =
    true;
}


/* --------------------------------
   QR SCANNED
-------------------------------- */

function onScanSuccess(decodedText) {

  if (processingScan) {
    return;
  }

  const participantId =
    decodedText.trim();

  if (!/^ICBS26-\d{4}$/.test(participantId)) {

    setStatus(
      "Invalid participant QR code.",
      "error"
    );

    return;
  }

  processingScan = true;

  const day =
    document.getElementById("day").value;

  const entrance =
    document.getElementById("entrance").value;

  setStatus(
    "Checking " + participantId + "...",
    "info"
  );

  sendAttendance(
    participantId,
    day,
    entrance
  );
}


/* --------------------------------
   SEND ATTENDANCE
-------------------------------- */

function sendAttendance(
  participantId,
  day,
  entrance
) {

  const params = new URLSearchParams();

  params.append(
    "action",
    "scan"
  );

  params.append(
    "participantId",
    participantId
  );

  params.append(
    "day",
    day
  );

  params.append(
    "entrance",
    entrance
  );

  /*
   * Use a hidden image request.
   *
   * This avoids the browser's
   * cross-origin/CORS restriction.
   *
   * The Apps Script endpoint will
   * still process the attendance.
   */

  const requestUrl =
    APPS_SCRIPT_URL +
    "?" +
    params.toString();

  const request =
    new Image();

  let completed = false;

  request.onload = function() {

    completed = true;

    setStatus(
      "Attendance request sent for " +
      participantId,
      "success"
    );

    processingScan = false;

    setTimeout(() => {

      setStatus(
        "Scanner ready to scan participant code.",
        "info"
      );

    }, 2500);
  };


  request.onerror = function() {

    completed = true;

    /*
     * Image requests may report an error
     * even when Google Apps Script has
     * received and processed the request.
     */

    setStatus(
      "Attendance request sent for " +
      participantId,
      "success"
    );

    processingScan = false;

    setTimeout(() => {

      setStatus(
        "Scanner ready to scan participant code.",
        "info"
      );

    }, 2500);
  };


  request.src = requestUrl;

}


/* --------------------------------
   CAMERA PERMISSION
-------------------------------- */

async function initializeCamera() {

  try {

    /*
     * Request camera permission first.
     */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true
      });

    stream
      .getTracks()
      .forEach(track => track.stop());

    await loadCameras();

  } catch (error) {

    console.error(error);

    setStatus(
      "Please allow camera access.",
      "error"
    );

  }

}


/* --------------------------------
   INITIALIZE
-------------------------------- */

window.addEventListener(
  "load",
  initializeCamera
);

</script>

</body>
</html>
