 <!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICBS 2026 Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      margin-top: 0;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 8px;
    }

    input, select {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #111;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      background: #aaa;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #cameraSelect {
      display: none;
    }

    #result {
      margin-top: 15px;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      min-height: 20px;
    }

    .success {
      background: #d9f7df;
      color: #126b2a;
    }

    .error {
      background: #ffdede;
      color: #9b111e;
    }

    .info {
      background: #e7f0ff;
      color: #164a9c;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>ICBS 2026</h2>
  <p><strong>Attendance Scanner</strong></p>

  <input
    type="password"
    id="pin"
    placeholder="Enter Staff PIN"
  >

  <select id="day">
    <option value="">Select Day</option>
    <option value="Day 1">Day 1</option>
    <option value="Day 2">Day 2</option>
    <option value="Day 3">Day 3</option>
  </select>

  <select id="entrance">
    <option value="">Select Entrance</option>
    <option value="Entrance 1">Entrance 1</option>
    <option value="Entrance 2">Entrance 2</option>
  </select>

  <button onclick="prepareCamera()">
    Start Scanner
  </button>

  <select id="cameraSelect" onchange="startSelectedCamera()">
  </select>

  <div id="reader"></div>

  <button
    id="stopButton"
    onclick="stopScanner()"
    style="display:none;"
  >
    Stop Scanner
  </button>

  <div id="result"></div>

</div>

<script>

const STAFF_PIN = "808901";

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzRASzTUExQTdYrQmiE7tI0XndhxdGD7V3ioYBz25Eo9Mu9MWB-2A61qvzgoVST8lUF8A/exec";

let html5QrCode = null;
let cameras = [];
let processingScan = false;

function showResult(message, type) {

  const result = document.getElementById("result");

  result.className = type;
  result.innerText = message;
}

async function prepareCamera() {

  const pin = document.getElementById("pin").value;
  const day = document.getElementById("day").value;
  const entrance = document.getElementById("entrance").value;

  if (pin !== STAFF_PIN) {
    showResult("Incorrect staff PIN.", "error");
    return;
  }

  if (!day) {
    showResult("Please select the conference day.", "error");
    return;
  }

  if (!entrance) {
    showResult("Please select the entrance.", "error");
    return;
  }

  showResult("Opening camera...", "info");

  try {

    /*
      First request camera permission directly.
      This helps iPhone Chrome expose the available cameras.
    */

    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    stream.getTracks().forEach(track => track.stop());

    cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      showResult("No camera was detected.", "error");
      return;
    }

    const cameraSelect =
      document.getElementById("cameraSelect");

    cameraSelect.innerHTML = "";

    cameras.forEach((camera, index) => {

      const option = document.createElement("option");

      option.value = camera.id;
      option.text =
        camera.label ||
        "Camera " + (index + 1);

      cameraSelect.appendChild(option);

    });

    cameraSelect.style.display = "block";

    /*
      Try to automatically select the rear camera.
    */

    let rearCamera = cameras.find(camera =>
      /back|rear|environment/i.test(camera.label)
    );

    if (rearCamera) {
      cameraSelect.value = rearCamera.id;
    }

    await startSelectedCamera();

  } catch (error) {

    console.error(error);

    showResult(
      "Camera could not start. Please check Chrome camera permission.",
      "error"
    );

  }
}

async function startSelectedCamera() {

  const cameraId =
    document.getElementById("cameraSelect").value;

  if (!cameraId) {
    return;
  }

  if (html5QrCode) {
    try {
      await html5QrCode.stop();
    } catch (e) {}
  }

  html5QrCode = new Html5Qrcode("reader");

  try {

    await html5QrCode.start(

      cameraId,

      {
        fps: 10,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const minEdge =
            Math.min(viewfinderWidth, viewfinderHeight);

          const size =
            Math.floor(minEdge * 0.70);

          return {
            width: size,
            height: size
          };

        }

      },

      onScanSuccess,

      onScanFailure

    );

    document.getElementById("stopButton").style.display =
      "block";

    showResult(
      "Scanner ready. Scan the participant QR code.",
      "success"
    );

  } catch (error) {

    console.error(error);

    showResult(
      "Unable to start the selected camera.",
      "error"
    );

  }
}

function onScanFailure(error) {
  // Ignore normal QR scanning misses.
}

function onScanSuccess(decodedText) {

  if (processingScan) {
    return;
  }

  processingScan = true;

  const participantId =
    decodedText.trim();

  const day =
    document.getElementById("day").value;

  const entrance =
    document.getElementById("entrance").value;

  showResult(
    "Checking " + participantId + "...",
    "info"
  );

  const callbackName =
    "icbsCallback_" +
    Date.now();

  window[callbackName] = function(response) {

    try {

      if (response.status === "SUCCESS") {

        showResult(
          "✓ ATTENDANCE RECORDED\n" +
          response.message,
          "success"
        );

      } else if (response.status === "DUPLICATE") {

        showResult(
          "⚠ ALREADY RECORDED\n" +
          response.message,
          "error"
        );

      } else {

        showResult(
          "✕ ERROR\n" +
          response.message,
          "error"
        );

      }

    } catch (error) {

      showResult(
        "Unable to process the scan.",
        "error"
      );

    }

    setTimeout(() => {
      processingScan = false;
    }, 2000);

    delete window[callbackName];
  };

  const url =
    APPS_SCRIPT_URL +
    "?action=scan" +
    "&participantId=" +
    encodeURIComponent(participantId) +
    "&day=" +
    encodeURIComponent(day) +
    "&entrance=" +
    encodeURIComponent(entrance) +
    "&callback=" +
    callbackName;

  const script =
    document.createElement("script");

  script.src = url;

  script.onerror = function() {

    showResult(
      "Connection error. Please try again.",
      "error"
    );

    processingScan = false;

    delete window[callbackName];

  };

  document.body.appendChild(script);

}

async function stopScanner() {

  if (html5QrCode) {

    try {
      await html5QrCode.stop();
      html5QrCode.clear();
    } catch (error) {
      console.log(error);
    }

    html5QrCode = null;
  }

  document.getElementById("stopButton").style.display =
    "none";

  document.getElementById("cameraSelect").style.display =
    "none";

  showResult(
    "Scanner stopped.",
    "info"
  );
}

</script>

</body>
</html>
